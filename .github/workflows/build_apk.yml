name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App & APK
        run: |
          flutter create my_app --org com.riya.ai
          cd my_app
          
          cat << 'EOF' > pubspec.yaml
    name: my_app
    description: Riya AI App
    publish_to: 'none'
    version: 1.0.0+1

    environment:
      sdk: '>=3.0.0 <4.0.0'

    dependencies:
      flutter:
        sdk: flutter
      http: ^1.2.0
      audioplayers: ^6.0.0

    flutter:
      uses-material-design: true
    EOF

          if [ -f ../lib/main.dart ]; then
            cp ../lib/main.dart lib/main.dart
          fi

          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml || true

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riya-AI-App
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
